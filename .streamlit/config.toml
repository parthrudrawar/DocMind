# Preview feature branch only. The live app continues using main's 2 MB config.
# Acceptance is not a guarantee that a 100 MB PDF passes processing limits.
[server]
maxUploadSize = 100
maxMessageSize = 10
enableCORS = true
enableXsrfProtection = true
enableStaticServing = false

[client]
showErrorDetails = false

[theme]
base = "dark"
primaryColor = "#818cf8"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#171d2b"
textColor = "#e2e8f0"
